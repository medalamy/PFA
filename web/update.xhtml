<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
    </h:head>
    <h:body style="text-align: center;">
        <h1>&nbsp;</h1>
        <h:form  style="display: inline-block;">

            <h:panelGrid id = "panel" columns = "2" border = "2"
                         cellpadding = "10" cellspacing = "2">

                <f:facet name = "header">
                    <h:outputText value = "Modification de compte"/>
                    <h:inputHidden value="#{User.user.id}"></h:inputHidden>

                </f:facet>
                <h:outputLabel for="username">Login</h:outputLabel>
                <h:inputText value="#{User.user.userName}" ></h:inputText>

                <h:outputLabel for="pass">mot de passe</h:outputLabel>
                <h:inputSecret value="#{User.user.pass}" ></h:inputSecret>

                <h:outputLabel for="fName">Prénom</h:outputLabel>
                <h:inputText value="#{User.user.fName}" ></h:inputText>

                <h:outputLabel for="lName">Nom</h:outputLabel>
                <h:inputText value="#{User.user.lName}" ></h:inputText>

                <h:outputLabel for="phone">Téléphone</h:outputLabel>
                <h:inputText value="#{User.user.phone}" ></h:inputText>

                <h:outputLabel for="email">email</h:outputLabel>
                <h:inputText value="#{User.user.email}" ></h:inputText>

                <f:facet name = "footer">
                    <h:panelGroup style = "display:block; text-align:center">
                        <h:commandButton value="Enregistrer" action="#{User.doUpdate()}"/>
                    </h:panelGroup>
                </f:facet>


            </h:panelGrid>

            <h:panelGrid id = "panel2" columns = "2" border = "1"
                         cellpadding = "2" cellspacing = "2">

                



            </h:panelGrid>

        </h:form>
    </h:body>
</html>
