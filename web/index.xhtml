<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      >
    <h:head>
        <h:outputStylesheet library = "css" name = "style.css" /> 

    </h:head>
    <h:body style="text-align: center;">
        <h:form  style="display: inline-block;">
            <h:dataTable value = "#{User.users}" var = "u"
                         styleClass = "employeeTable"
                         headerClass = "employeeTableHeader"
                         rowClasses = "employeeTableOddRow,employeeTableEvenRow">

                <h:column>    				
                    <f:facet name = "header">Nom d'utilisateur</f:facet>    				
                        #{u.userName}
                </h:column>

                <h:column>
                    <f:facet name = "header">Nom</f:facet>
                        #{u.lName}
                </h:column>

                <h:column>
                    <f:facet name = "header">Prénom</f:facet>
                        #{u.fName}
                </h:column>

                <h:column>
                    <f:facet name = "header">Téléphone</f:facet>
                        #{u.phone}
                </h:column>

                <h:column>
                    <f:facet name = "header">Email</f:facet>
                        #{u.email}
                </h:column>
                <h:column>
                    <f:facet name = "header">Role</f:facet>
                        #{u.role}
                </h:column>
                <h:column>
                    <f:facet name = "header"></f:facet>
                    <h:commandButton value="Supprimer" action="#{User.delete(u)}"/>
                </h:column>
                <h:column>
                    <f:facet name = "header"></f:facet>
                    <h:commandButton value="Modifier" action="#{User.update(u)}"/>
                </h:column>
            </h:dataTable>
            <h:link value="Créer un utilisateur" outcome="create"></h:link>

        </h:form>
    </h:body>
</html>
